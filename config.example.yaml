# ═══════════════════════════════════════════════════════════════════
#  QQ 群管理机器人 —— 运行配置
# ═══════════════════════════════════════════════════════════════════
#
#  启动：go run ./cmd/bot -config config.yaml
#
#  常量可以写成 ${环境变量名} 的形式，加载时从环境里取值，密钥就不必写进文件。
#  引用了但未设置的变量会导致启动失败（而不是悄悄变成空串）。
#  注意：这个展开会连注释一起扫，所以下面说明里不要写出可被识别的完整写法。
#
#  本文件里核心段的键名会被校验，写错会启动失败而不是被忽略。


# ───────────────────────────────────────────────────────────────────
#  机器人与群
# ───────────────────────────────────────────────────────────────────
bot:
  # 凭证二选一。access_token 优先：填了它就不会去换取 token、也不会刷新。
  appid: ""
  client_secret: ""
  access_token: ""

  # true 走沙箱环境
  sandbox: false

  # 完全覆盖请求地址（自建网关、测试用）。留空则由上面的 sandbox 决定。
  base_url: ""

  # **官 bot 自己的 QQ 号**（群里看到的那个号）。
  # 只有"踢人外包"需要它：程序会读回官 bot 自己发的 @ 消息来取 QQ 号，
  # 必须能确认那条消息确实出自官 bot，否则群里任何人都能照抄标记、
  # 改成 @ 别人，诱导 bot 踢错人。
  qq: 0
  #  4016438750

  # 要管理的群。**建议显式列出**：留空等于"机器人在的所有群都会被管到"，
  # 通常不是你想要的。
  #
  # 每个群有两个互不相通的标识：
  #   openid      —— 官方接口和事件里用的，所有官方 API 都靠它
  #   qq_group_id —— OneBot 用的群号（只为"踢人外包"服务）
  #
  # 只填 openid 也能跑，只是那个群无法用 OneBot 踢人。
  groups: []
  #  - openid: "FABED0ACCA31B997DFF11DC30658D252"   # 从群事件的 group_openid 获取
  #    qq_group_id: 1015779284                       # 你在 QQ 里看到的群号


# ───────────────────────────────────────────────────────────────────
#  OneBot（踢人外包）
# ───────────────────────────────────────────────────────────────────
#
#  为什么需要它：官方平台的「群成员批量移除」接口会对本应用返回
#  40012010（应用无接口访问权限）—— 即使机器人已经是群管理员。
#  实测确认过，所以"踢人"只能交给一个 OneBot 账号执行。
#
#  两边对同一个人/同一个群的标识完全不同，且没有接口可以互转：
#    官方只给 openid，OneBot 只认 QQ 号。
#  桥是"@ "：官 bot 在群里 @ 某人，平台会把这条 @ 解析成真实 QQ 号再发给
#  其他客户端，OneBot 因此能读回那个 QQ 号（实测确认）。
#  为防止有人照抄标记伪造一条 @ 别人的消息，读回时会严格比对发送者
#  （即上面的 bot.qq）。
#
#  留空 url 就等于不启用外包，那时需要移除成员的情形只会报警、由人处理。
onebot:
  url: ""
  # 例如 http://127.0.0.1:3000
  access_token: ""
  # 也可以引用环境变量（把上面那行换成引用写法），见文件开头的说明

  # 单次 OneBot 调用的超时
  timeout_seconds: 10


# ───────────────────────────────────────────────────────────────────
#  日志
# ───────────────────────────────────────────────────────────────────
# 数据层：持久化「待验证扣留」与「禁止加群名单」。
# 默认 sqlite，文件落在 $XDG_STATE_HOME/qq-group-management-bot/bot.db
# （缺省 ~/.local/state/...）。换 postgres 只改这一段：代码一套、两种方言。
# 注意 sqlite 是单写者，max_open_conns 保持 1；postgres 可调高。
database:
  driver: sqlite        # sqlite | postgres
  dsn: ""               # sqlite 是文件路径；postgres 是连接串。留空用上面的默认值
  max_open_conns: 1

log:
  level: info    # debug | info | warn | error
  format: text   # text | json


# ───────────────────────────────────────────────────────────────────
#  功能开关
# ───────────────────────────────────────────────────────────────────
#
#  一个功能一个段落。段落写出来就等于开启，关掉请写 enabled: false。
#  段落名必须是程序里注册过的功能名；写错会在启动时报错。
features:

  # ─── 进出群记录 ─────────────────────────────────────────────────
  # 有人进群、有人离开，各写一行进数据库（表 member_events），记群名、群 openid、
  # 群号、成员 openid 和事件时间。
  #
  # 为什么必须落库：这个机器人拿不到成员列表（ListGroupMembers / GetGroupMember
  # 对本应用一律 40012010 无权限，实测），所以群的成员构成事后无法回查 —— 谁走了，
  # 没写下来就永远查不到。
  #
  # 注意：平台把「主动退群」和「被管理员踢」报成同一个事件，里面只有当事人，
  # 没有操作人，所以两者都记成 leave，不猜。
  member_log:
    enabled: true

  # ─── 禁言白名单：别人禁言了名单里的人，机器人自动解禁 ──────────────
  # 名单里的成员被人（群主、其他管理员、QQ 客户端）单独禁言后，本功能发现就把禁言解掉；
  # **机器人自己下的禁言一律不动**（/禁言、举报惩罚、入群验证的扣留）。
  #
  # 为什么是轮询：平台既没有「成员被禁言」事件，也不说一条禁言是谁下的。能做的是
  # 读一次全群禁言状态（一次调用返回当前被禁言的成员，过期的不含），把机器人自己的
  # 那些挑出去，剩下的解掉。所以每次扫描 = 每个受管群一次 GET。
  #
  # 什么不算「别人禁的」：
  #   - 入群验证的扣留：记录读自数据库（pending 表），重启后依然认得出，绝不会误放人；
  #   - /禁言 与举报惩罚：调用时记在进程内，机器人重启会忘（重启后这类禁言可能被解）。
  #
  # 不管的事：**全员禁言**（群整体禁言）。那是群主对整群的决定，不是针对某个人，
  # 本功能不去推翻它；但会在日志里明说「整群被禁言，名单里的人也说不了话」，
  # 免得看起来像功能没生效。
  #
  # 名单粒度：顶层 members 是所有受管群的默认名单；某个群写了 members 就是**替换**
  # （不是追加）——没写才继承顶层。写 members: [] 表示这个群谁都不保。
  # 只有 bot.groups 里的群会被扫描：别的群平台不投事件，禁言也不归这个机器人管。
  mute_guard:
    enabled: false
    # 多久看一次每个群。太短会被平台限流，太长则别人禁言后要等这么久才解。
    # 允许 10 ~ 3600 秒，默认 30。
    interval_seconds: 30
    # 所有受管群的默认名单（member_openid，与群 admin 名单里同一个值）
    members: []
      # - "要一直能说话的成员的 member_openid"
    # 按群覆盖
    # groups:
    #   "群 openid":
    #     enabled: true          # 这个群单独开关（false = 不扫描）
    #     members:               # 替换顶层名单
    #       - "该群要保的成员 member_openid"

  # ─── 新人入群人机验证 ───────────────────────────────────────────
  # 有人进群 → 立刻禁言 → 群里发一条带按钮的提示（并 @ 本人）→
  # 本人点击按钮 → 解除禁言。
  #
  # 全程在群内完成，不需要私聊。这也是这个平台上唯一可行的做法：
  # 私聊要求对方先添加机器人为好友，而按钮点击会直接告诉你
  # 「哪个群的哪个成员」点的。
  join_verification:
    enabled: true

    # 待验证成员落盘的位置。**必须有**：漏了配置时启动会打 WARN，而后果是
    # 每次重启都遗忘所有正在等待验证的人 —— 真禁言模式下他们仍被禁言，却没人
    # 知道、没人处理、按钮也点不动；伪禁言模式下更干脆：机器人不再撤回，
    # 未验证的人就等于被放行了。留空等于关掉持久化。
    state_file: "/home/USER/.local/state/qq-group-management-bot/pending.json"

    # 验证期间怎么按住未验证的人（可按群覆盖）：
    #   mute   —— 真禁言：调平台禁言接口，本人被平台静音，验证通过时解除。
    #             平台直接拒收消息，群里谁也读不到，所以是更强的那个（默认）
    #   pseudo —— 伪禁言：不调禁言接口，未验证的人一发消息就被立刻撤回，
    #             并且那条消息不写进 Redis 消息缓存（举报判定读的就是它）。
    #             一直持续到本人验证通过为止 —— 所以 mute_minutes 与
    #             on_deadline: remute 在这个模式下都没有意义（没有会到期的
    #             禁言需要续；on_deadline: remove 仍然是到点踢人）。
    #
    # 伪禁言的两个前提（缺一个就静默失效：机器人以为按住了，人在群里照说）：
    #   * 机器人在该群是管理员 —— 撤回别人的消息需要管理员权限
    #   * 该群给机器人传"全部消息" —— 只传 @ 的群，机器人根本收不到那条消息
    # 这两种情况启动时会各打一条 WARN 提醒。
    # 另外：伪禁言不占平台的禁言名额，但机器人要对每条消息调一次撤回接口，
    # 被刷屏时要留意接口频率。
    mute_mode: mute

    # 验证期间禁言多久（分钟）。只对 mute 模式有效：伪禁言没有到期这一说。
    # 平台上限是 30 天，这里默认 29 天：陌生人在禁言失效前无法发言。
    mute_minutes: 41760          # 29 天

    # 多久没验证就上报管理员。必须明显小于上面的禁言时长。
    deadline_hours: 48

    # 超时后的动作：
    #   none   什么都不做（等禁言自己到期，人留在群里）
    #   notify 在群里 @ 管理员请他们处理
    #   remove 通知不了，直接把该成员移出群
    #   remute 不踢人：每到一次期就再禁一次并把两个时间戳前推，
    #          一直续到本人验证通过（等于"验证前一直禁言"）
    on_deadline: remute

    # 用哪个后端执行移除（只在 on_deadline: remove 时有意义）：
    #   onebot   —— 交给 OneBot 账号执行（不需要额外权限，推荐）
    #   official —— 调官方接口（本应用实测被拒 40012010，仅当你申请到权限才有用）
    remove_backend: onebot

    # 管理员点他人按钮跳过验证时发的话。{target} 渲染成对被跳过者的 @
    skip_message: "管理员已跳过 {target} 的验证"

    # ── 按群覆盖 ───────────────────────────────────────────────────
    # 上面所有字段都是"各群默认值"。某个群想不同，就写在 groups 里，
    # **只覆盖它写了的那几项**（没写的继续继承默认值）。
    # 两个群一旦规则不同（一个大群只续禁言、一个小群直接踢），
    # 单一全局设置就表达不了，所以有了这一段。
    groups:
      "FABED0ACCA31B997DFF11DC30658D252":
        # 这个群可以单独改成伪禁言：未验证的人发消息直接撤回、不入缓存。
        # 去掉下面这行的注释即可（其余字段继续继承上面的默认值）。
        # mute_mode: pseudo
        on_deadline: notify
        # 该群超时要 @ 谁（管理员的群成员 openid）
        notify_members:
          - "A1B2C3D4E5F6A1B2C3D4E5F6A1B2C3D4"

    # 超时通知的文案，可用占位符：
    #   {at}     该群 notify_members 里所有人的 @
    #   {target} 没通过验证的那个成员的 @
    #   {hours}  deadline_hours
    notify_message: "{at} 有成员进群 {hours} 小时仍未完成验证，请处理：{target}"

    # 验证卡片里是否 @ 新成员本人
    mention_new_member: true

    # 验证提示（Markdown）。{at} 是 @ 新成员的位置。
    # 键盘（按钮）只会挂在 Markdown 消息上，用纯文本按钮会被平台丢弃。
    prompt: |
      {at}
      **欢迎新成员！**
      请点击下方按钮完成验证，验证通过后即可发言。

    button_label: "✅ 我是真人"   # 按钮文字，最多 10 个字符
    visited_label: "已验证"       # 点击后按钮上显示的文字
    pass_message: "验证通过，欢迎你！"   # 验证通过后在群里说的一句，留空则不发送

    # 只发提示、只响应按钮，不真的禁言/解禁/踢人。
    # 用来在真实群里试跑整个流程而不影响任何人。
    dry_run: false

  # ─── 入群申请处理 ──────────────────────────────────────────────
  join_request:
    enabled: false

    # ignore  = 不处理，交给人工审批（默认，因为放人与拒绝都应该由你决定）
    # approve = 自动批准
    # decline = 自动拒绝
    action: ignore

    # 仅 action: decline 时可填
    reject_reason: ""

    # 无论 action 是什么，都拒绝被平台标记为机器人的申请
    decline_bots: false
    # 名单里的人来申请加群时：decline（默认，直接拒绝）或 ignore（留给人处理）。
    # 只有这两个取值 —— 在名单上不等于被批准。它只影响审批：绝不踢人，
    # 也不追溯已经在群里的人。名单由群内命令 /黑名单 管理。
    barred: decline

    # ── 黑名单（已预留，当前为空实现）─────────────────────────────
    # 每个申请到达时，**第一步**就是查黑名单；在黑名单里的人会被拒绝，
    # 不管 action 写的是什么（包括 approve）。
    #
    # 名单本身还没有来源：钩子在 internal/features/joinrequest 里，
    # 现在返回"不禁止任何人"。将来实现它时只需换掉那个实现，
    # 处理顺序无需改动 —— 所以这里目前没有对应的配置项。
    #
    # 实现时注意：名单以 member_openid 为主键（本应用内标识）；
    # 事件里同时带 union_openid（跨应用标识），若名单要比本 bot 活得久就用后者。
    # 查询失败必须当作"未知"：程序会转为人工处理，而不是猜着放行或拒绝。

  # ─── 管理命令 ──────────────────────────────────────────────────
  # 命令表：
  #   /菜单                       列出命令（对所有人开放：它只是帮助文本）
  #   /whois                      打印本群与成员的 openid，用来写配置
  #   /禁言 <时长> [@目标]         顺序随意，例如 "/禁言 1h @某人" 或 "/禁言 @某人 1h"
  #   /解禁 [@目标]                解除禁言；正在验证中的成员不受此命令影响
  #   /重新发送验证 [@目标]        给正在验证的人重发通知（沿用他已有的按钮）
  #   /重新验证 [@目标]            重新开始一轮：换新令牌、重新禁言、发新卡片
  #   /debug 超时测试 [@目标]      立刻走一遍超时处理（需 debug: true）
  #
  # 目标只能用 @ 指定。平台不给"用 QQ 号指定成员"的接口（实测），所以
  # 无法实现 /禁言 123456789。
  # 引用消息 + AI 送检的违规检测。
  # 默认关闭：先用 dry_run 观察误报率，再决定是否让它动手。
  moderation:
    enabled: false
    dry_run: true
    cache_hours: 6                 # 消息在 Redis 里留多久（也是能回溯的上限）
    context_before: 10             # 被举报者本人之前的消息，至多取几条
    context_after: 10              # 之后的，至多取几条
    chain_minutes: 10              # 且链两端间隔不超过这么多分钟
    # 只送被举报者本人的消息：窗口里不会有别人说的话。别人的广告看到了也动不了
    # （撤回只允许针对被举报者），而且旁人的话不该进一个与他无关的判定。
    context_scope: group           # group（该群时间线）| sender（只看发送者）
    max_chars: 12000               # 送检正文上限，超出会在提示里标明已截断

    # OpenAI 格式。name 填好之后判定才会启用；留空时 /违规举报 只会回
    # 「送检失败，未采取任何处理」，不会误伤任何人。
    #
    # 这里刻意不写环境变量引用语法：被引用的变量必须已经存在，否则机器人根本
    # 起不来。要放环境变量，就留空 api_key，并把 MODERATION_API_KEY 放进服务环境。
    model:
      base_url: "https://api.deepseek.com/v1"
      api_key: ""
      name: ""
      # 思考模式：hide（思考开着，思维链只进违规记录不写日志）/ show（连日志一起写，
      # 排查误判用）/ off（关掉思考）/ 留空（什么都不发，由服务端默认决定）。
      # 注意：思维链会随违规记录一起落库，管理员用 /违规查询 <回执单号> 就能读到，
      # 所以它永远不会出现在群里。
      # 实测：不发这个开关时，deepseek-chat 只输出 5 个 token、思维链 0 字符 —— 等于没思考。
      thinking: hide
      reasoning_effort: high       # low / medium / high / max；服务端默认 high
      max_tokens: 4096             # 思维链也算在这个额度里；1024 实测偏紧，容易截断成读不出的答案
      retries: 2                   # 回答不是 JSON 时重试几次（0-3，留空用默认 2）
      timeout_seconds: 30
      stream: false                # 判定不需要流式；注意流式发不了 thinking 开关
      temperature: 0

      # 识图开关：这个模型能不能看图。**默认关**。
      #   关 —— 图片消息无法举报：被举报那条**带图**就直接回「无法举报图片消息」，
      #         消息链里别的消息带图则跳过那张图，只判文字。
      #   开 —— 图片随判定一起送（每张图前一行说明它属于第几条消息），图片和文字
      #         按同一套规则判。
      # 为什么默认关：关着的时候把图送过去，读不了图的端点最坏会顺着"这里有张图"
      # 编出一条违规，而误伤比漏过贵得多。开启前请确认 name 那个模型真能看图 ——
      # 不能看的模型会直接报错，那次判定就成了「送检失败」，不会误伤但也不算判定。
      vision: false

    # 图片缓存：判定要看图，而**一张图只有一次机会**。事件里的附件 URL 是预签名的
    # 短效链接，平台也没有"按消息 id 取回消息"的接口（SDK 里都没有），收到事件时不
    # 抓下来，这张图就永远看不到了 —— 所以图片**无论识图开关开没开都在存**（关着也
    # 存，将来打开至少还有最近几小时的图），保留时长跟 cache_hours 一致。
    #
    # 存的是文件，不是 Redis：一条消息一张图几百 KB 到几 MB，塞进共用的 Redis 是拿
    # 内存换省事。目录过期由自己按 mtime 清理，另外启动时扫一次。
    images:
      # 落盘目录。留空 = $XDG_CACHE_HOME/qq-group-management-bot/images
      # （默认 ~/.cache/qq-group-management-bot/images）。
      # 这是缓存：整个目录丢了只损失"那几次判定看不到图"，不影响别的东西。
      dir: "/home/USER/.cache/qq-group-management-bot/images"

      # 一条消息的图**总共**允许多久抓完（不是每张图各自算）。
      # 跑在收消息的路径上，所以短：抓不到的图就是那次判定少一张图。
      download_timeout_seconds: 8

      # 一条消息最多留几张图，超出只留前几张：50 个附件的消息不该是 50 次下载。
      # 0 = 不限制（全留）。删掉这一行 = 默认 4。
      max_per_message: 4

      # 超过这个字节数就压缩后再存：长边缩到 max_edge、重编码成 JPEG(q80)。
      # 动图 GIF 不压缩（重编码等于只留第一帧，而那正是广告要的那部分），原样存。
      # 0 = 不压缩。删掉这一行 = 默认 262144（256 KiB）。
      compress_above_bytes: 262144

      # 压缩后仍超过这个字节数就整张丢弃。丢了图，对应那条举报就会变成"看不到图"
      # （纯图片消息会直接拒绝判定，带文字的消息仍照文字判），所以别调太小。
      # 0 = 不限制。删掉这一行 = 默认 2097152（2 MiB，在压缩产物之上，正常只会
      # 命中平台发来的怪东西）。
      max_bytes: 2097152

      # 压缩后的长边上限，0 或删掉这一行 = 默认 1568。
      max_edge: 1568

    # 违规类型 → 展示名 + 禁言时长（Go 语法：30s / 10m / 6h / 1d）。
    # 表外的类型一律不动作；类型没写时长的用 default_mute。
    categories:
      ad:    { label: "广告", mute: "10m" }
      fraud: { label: "诈骗", mute: "6h" }
    default_mute: "10m"

    # 未发现违规时是否反噬举报者（默认关）。
    report_penalty:
      enabled: false
      mute: "10m"

    # 高风险名单：名单内的人**每发一条消息都送 AI 判定**，不必等谁举报。
    # 管理员用 `/高风险 add <@人|openid> <时长> [原因]` 标记，remove 解除，list 查看。
    # 判定违规时自动撤回判定点名的、属于本人的消息，并按类别禁言（时长同 categories）；
    # 不往群里发任何提示 —— 做了什么写在判定记录里，用 /违规查询 看。
    # 代价是每条消息一次模型调用，所以名单短、时限有限才有意义。
    high_risk:
      enabled: true

      # 被判定违规累计 N 次后自动进名单（跨群累计，只看「判违规」的那些记录）。
      # 0（默认）表示关掉自动标记，只认管理员手动标记。
      auto_mark_after: 0

      # 自动标记的时限，Go 时长语法（168h = 7 天）。手动标记的时长由命令给，
      # 这里是没人指定时限的那一种 —— 本名单**没有永久项**，store 会拒绝写零。
      auto_mark_for: "168h"

      # 同时进行的自动判定上限，超出的消息跳过并记一条 WARN。
      # 在启动时决定，改了要重启（reload 会拒绝）。
      max_in_flight: 3

    # 每群独立设置。allow 是判定材料而不是否决权：它作为「本群自己的地址」写进
    # 判定提示，模型据此判断哪些链接属于本群、哪些是竞品或引流（见 moderation 的
    # allowedIn 注释：内容豁免两次都被拆分域名绕过，所以代码里不再做匹配）。
    # topic 是本群场景：同场景的推广一律算违规。
    # groups:
    #   "群 openid":
    #     allow: ["example.com", "*.example.com"]
    #     topic: "AI API 中转站、大模型中转与代理"
    #     categories: { ad: "30m" }
    #     enabled: false
  admin_commands:
    enabled: true

    prefix: "/"

    # /debug 是否可用
    debug: true

    # 是否把命令清单注册成平台的「指令面板」（群里点开就是这份菜单）。
    # 默认开启：不开的话，成员只能靠别人告诉才知道有哪些命令。
    # /debug 永远不注册 —— 它是给运维用的，不该摆在群里让人按。
    # 面板按 bot.groups 里的群生效；bot.groups 为空时对所有群生效。
    register_commands: true

    # /whois 是否仅管理员可用。
    # 群里**还没配管理员**时它对该群所有人开放 —— 那正是把管理员列表
    # 写出来的唯一办法。未配置的群同理：那里的消息本来会被全部丢弃，
    # 只放行 /whois，否则新群永远配不出来。
    whois_admin_only: true

    # 是否必须 @ 机器人。开启后 @ 别人不会触发命令：程序会拿机器人自己的
    # openid 与正文里那个 @ 比对，而不是"开头有 @ 就算"。
    require_mention: true

    # ── 按群的管理员名单 ───────────────────────────────────────────
    # 只认这里列出的 member_openid。名单外一律拒绝 —— **包括 QQ 群主和
    # 群管理员本身**：平台身份不等于本程序的管理权限，否则任何人在 QQ 里
    # 被设成群管理，就顺带拿到了这些命令。
    groups:
      "FABED0ACCA31B997DFF11DC30658D252":
        admins:
          - "A1B2C3D4E5F6A1B2C3D4E5F6A1B2C3D4"
        # 该群禁言上限，可低于全局的 29 天。支持 30s / 10m / 2h / 1d
        # 及 30秒 / 10分 / 2小时 / 1天
        max_mute: "29d"

  # ─── 群广播（匿名通报）──────────────────────────────────────────
  # 在**私聊**里发 /群广播（别名 /群通报）打开一张卡片：MD 渲染开关、匿名开关、
  # 要发到哪些群，每个选项都要点过一遍才能继续，然后写下内容、看一眼预览、发送。
  #
  #   - 只在私聊里写：卡片（参数、正文、预览）全都留在私聊，群里只会收到最后那条
  #     广播。在群里发这条命令不开卡片，只会被告知去私聊写。
  #   - 卡片里的群只列**你当管理员的群**，发到别的群也会被拒绝。
  #   - 头部是「来自管理员的广播」（关掉匿名则是「来自 <@发送者> 的广播」），
  #     下面一条分割线，然后是正文；
  #   - 正文支持粘贴多行（QQ 群消息没法按回车换行，粘贴是唯一办法）；
  #   - 发出去用的是「主动消息」，群没开主动推送时那一条会点名说明发不出去。
  #
  # /广播审计（别名 /广播记录）：群里用看本群记录，私聊里用看**你管理的群**的记录，
  # 看不到别人管的群。标题是「广播记录（你管理的 3 个群，共 x 条）第 x 页 / 共 x 页」，
  # 每页 5 条：时间 · 发到了哪些群（群名称）· 匿名发出/署名发出 · 发起人 openid，下面
  # 一行是广播正文首行（超长截断），末尾带免责声明。翻页会撤回上一页。
  #
  # 审计**不受内测门控限制**：门控管"写"（把话送进群），审计管"查"——不查就没法给匿名
  # 广播追责，所以名单外的人也能用。
  #
  # "你管理的群"是怎么认出来的：平台在群场景把这叫 member_openid、在私聊场景叫
  # user_openid，但**实测同一个人两处是同一个值**（本应用，2026-10-04 核对过）。所以
  # 一份 admin 名单在群里和私聊里都认得出，不需要为私聊再写一遍；私聊里若被告知
  # "不在任何群的管理员名单里"，那是名字确实没写进任何群的 admins，不是 id 用错了。
  #
  # 内测门控：beta.enabled 打开后只有 beta.whitelist 里的人能用，其他人一律收到
  # 「功能正在内测阶段，暂无法使用。」。名单填 openid，与群 admin 名单里那个是同一个
  # 值；卡片只在私聊里开。
  broadcast:
    enabled: false
    beta:
      enabled: false
      whitelist: []
        # - "允许内测的人的 openid（与群 admin 名单里同一个值）"

