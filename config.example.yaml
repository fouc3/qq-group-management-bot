# ═══════════════════════════════════════════════════════════════════
#  QQ 群管理机器人 —— 运行配置
# ═══════════════════════════════════════════════════════════════════
#
#  启动：go run ./cmd/bot -config config.yaml
#
#  常量可以写成 ${环境变量名} 的形式，加载时从环境里取值，密钥就不必写进文件。
#  引用了但未设置的变量会导致启动失败（而不是悄悄变成空串）。
#  注意：这个展开会连注释一起扫，所以下面说明里不要写出可被识别的完整写法。
#
#  本文件里核心段的键名会被校验，写错会启动失败而不是被忽略。


# ───────────────────────────────────────────────────────────────────
#  机器人与群
# ───────────────────────────────────────────────────────────────────
bot:
  # 凭证二选一。access_token 优先：填了它就不会去换取 token、也不会刷新。
  appid: ""
  client_secret: ""
  access_token: ""

  # true 走沙箱环境
  sandbox: false

  # 完全覆盖请求地址（自建网关、测试用）。留空则由上面的 sandbox 决定。
  base_url: ""

  # **官 bot 自己的 QQ 号**（群里看到的那个号）。
  # 只有"踢人外包"需要它：程序会读回官 bot 自己发的 @ 消息来取 QQ 号，
  # 必须能确认那条消息确实出自官 bot，否则群里任何人都能照抄标记、
  # 改成 @ 别人，诱导 bot 踢错人。
  qq: 0
  #  4016438750

  # 要管理的群。**建议显式列出**：留空等于"机器人在的所有群都会被管到"，
  # 通常不是你想要的。
  #
  # 每个群有两个互不相通的标识：
  #   openid      —— 官方接口和事件里用的，所有官方 API 都靠它
  #   qq_group_id —— OneBot 用的群号（只为"踢人外包"服务）
  #
  # 只填 openid 也能跑，只是那个群无法用 OneBot 踢人。
  groups: []
  #  - openid: "FABED0ACCA31B997DFF11DC30658D252"   # 从群事件的 group_openid 获取
  #    qq_group_id: 1015779284                       # 你在 QQ 里看到的群号


# ───────────────────────────────────────────────────────────────────
#  OneBot（踢人外包）
# ───────────────────────────────────────────────────────────────────
#
#  为什么需要它：官方平台的「群成员批量移除」接口会对本应用返回
#  40012010（应用无接口访问权限）—— 即使机器人已经是群管理员。
#  实测确认过，所以"踢人"只能交给一个 OneBot 账号执行。
#
#  两边对同一个人/同一个群的标识完全不同，且没有接口可以互转：
#    官方只给 openid，OneBot 只认 QQ 号。
#  桥是"@ "：官 bot 在群里 @ 某人，平台会把这条 @ 解析成真实 QQ 号再发给
#  其他客户端，OneBot 因此能读回那个 QQ 号（实测确认）。
#  为防止有人照抄标记伪造一条 @ 别人的消息，读回时会严格比对发送者
#  （即上面的 bot.qq）。
#
#  留空 url 就等于不启用外包，那时需要移除成员的情形只会报警、由人处理。
onebot:
  url: ""
  # 例如 http://127.0.0.1:3000
  access_token: ""
  # 也可以引用环境变量（把上面那行换成引用写法），见文件开头的说明

  # 单次 OneBot 调用的超时
  timeout_seconds: 10


# ───────────────────────────────────────────────────────────────────
#  日志
# ───────────────────────────────────────────────────────────────────
# 数据层：持久化「待验证扣留」与「禁止加群名单」。
# 默认 sqlite，文件落在 $XDG_STATE_HOME/qq-group-management-bot/bot.db
# （缺省 ~/.local/state/...）。换 postgres 只改这一段：代码一套、两种方言。
# 注意 sqlite 是单写者，max_open_conns 保持 1；postgres 可调高。
database:
  driver: sqlite        # sqlite | postgres
  dsn: ""               # sqlite 是文件路径；postgres 是连接串。留空用上面的默认值
  max_open_conns: 1

log:
  level: info    # debug | info | warn | error
  format: text   # text | json


# ───────────────────────────────────────────────────────────────────
#  功能开关
# ───────────────────────────────────────────────────────────────────
#
#  一个功能一个段落。段落写出来就等于开启，关掉请写 enabled: false。
#  段落名必须是程序里注册过的功能名；写错会在启动时报错。
features:

  # ─── 新人入群人机验证 ───────────────────────────────────────────
  # 有人进群 → 立刻禁言 → 群里发一条带按钮的提示（并 @ 本人）→
  # 本人点击按钮 → 解除禁言。
  #
  # 全程在群内完成，不需要私聊。这也是这个平台上唯一可行的做法：
  # 私聊要求对方先添加机器人为好友，而按钮点击会直接告诉你
  # 「哪个群的哪个成员」点的。
  join_verification:
    enabled: true

    # 待验证成员落盘的位置。**必须有**：漏了配置时启动会打 WARN，而后果是
    # 每次重启都遗忘所有正在等待验证的人 —— 他们仍被禁言，却没人知道、
    # 没人处理、按钮也点不动。留空等于关掉持久化。
    state_file: "/home/USER/.local/state/qq-group-management-bot/pending.json"

    # 验证期间禁言多久（分钟）。
    # 平台上限是 30 天，这里默认 29 天：陌生人在禁言失效前无法发言。
    mute_minutes: 41760          # 29 天

    # 多久没验证就上报管理员。必须明显小于上面的禁言时长。
    deadline_hours: 48

    # 超时后的动作：
    #   none   什么都不做（等禁言自己到期，人留在群里）
    #   notify 在群里 @ 管理员请他们处理
    #   remove 通知不了，直接把该成员移出群
    #   remute 不踢人：每到一次期就再禁一次并把两个时间戳前推，
    #          一直续到本人验证通过（等于"验证前一直禁言"）
    on_deadline: remute

    # 用哪个后端执行移除（只在 on_deadline: remove 时有意义）：
    #   onebot   —— 交给 OneBot 账号执行（不需要额外权限，推荐）
    #   official —— 调官方接口（本应用实测被拒 40012010，仅当你申请到权限才有用）
    remove_backend: onebot

    # 管理员点他人按钮跳过验证时发的话。{target} 渲染成对被跳过者的 @
    skip_message: "管理员已跳过 {target} 的验证"

    # ── 按群覆盖 ───────────────────────────────────────────────────
    # 上面所有字段都是"各群默认值"。某个群想不同，就写在 groups 里，
    # **只覆盖它写了的那几项**（没写的继续继承默认值）。
    # 两个群一旦规则不同（一个大群只续禁言、一个小群直接踢），
    # 单一全局设置就表达不了，所以有了这一段。
    groups:
      "FABED0ACCA31B997DFF11DC30658D252":
        on_deadline: notify
        # 该群超时要 @ 谁（管理员的群成员 openid）
        notify_members:
          - "A1B2C3D4E5F6A1B2C3D4E5F6A1B2C3D4"

    # 超时通知的文案，可用占位符：
    #   {at}     该群 notify_members 里所有人的 @
    #   {target} 没通过验证的那个成员的 @
    #   {hours}  deadline_hours
    notify_message: "{at} 有成员进群 {hours} 小时仍未完成验证，请处理：{target}"

    # 验证卡片里是否 @ 新成员本人
    mention_new_member: true

    # 验证提示（Markdown）。{at} 是 @ 新成员的位置。
    # 键盘（按钮）只会挂在 Markdown 消息上，用纯文本按钮会被平台丢弃。
    prompt: |
      {at}
      **欢迎新成员！**
      请点击下方按钮完成验证，验证通过后即可发言。

    button_label: "✅ 我是真人"   # 按钮文字，最多 10 个字符
    visited_label: "已验证"       # 点击后按钮上显示的文字
    pass_message: "验证通过，欢迎你！"   # 验证通过后在群里说的一句，留空则不发送

    # 只发提示、只响应按钮，不真的禁言/解禁/踢人。
    # 用来在真实群里试跑整个流程而不影响任何人。
    dry_run: false

  # ─── 入群申请处理 ──────────────────────────────────────────────
  join_request:
    enabled: false

    # ignore  = 不处理，交给人工审批（默认，因为放人与拒绝都应该由你决定）
    # approve = 自动批准
    # decline = 自动拒绝
    action: ignore

    # 仅 action: decline 时可填
    reject_reason: ""

    # 无论 action 是什么，都拒绝被平台标记为机器人的申请
    decline_bots: false
    # 名单里的人来申请加群时：decline（默认，直接拒绝）或 ignore（留给人处理）。
    # 只有这两个取值 —— 在名单上不等于被批准。它只影响审批：绝不踢人，
    # 也不追溯已经在群里的人。名单由群内命令 /黑名单 管理。
    barred: decline

    # ── 黑名单（已预留，当前为空实现）─────────────────────────────
    # 每个申请到达时，**第一步**就是查黑名单；在黑名单里的人会被拒绝，
    # 不管 action 写的是什么（包括 approve）。
    #
    # 名单本身还没有来源：钩子在 internal/features/joinrequest 里，
    # 现在返回"不禁止任何人"。将来实现它时只需换掉那个实现，
    # 处理顺序无需改动 —— 所以这里目前没有对应的配置项。
    #
    # 实现时注意：名单以 member_openid 为主键（本应用内标识）；
    # 事件里同时带 union_openid（跨应用标识），若名单要比本 bot 活得久就用后者。
    # 查询失败必须当作"未知"：程序会转为人工处理，而不是猜着放行或拒绝。

  # ─── 管理命令 ──────────────────────────────────────────────────
  # 命令表：
  #   /菜单                       列出命令（对所有人开放：它只是帮助文本）
  #   /whois                      打印本群与成员的 openid，用来写配置
  #   /禁言 <时长> [@目标]         顺序随意，例如 "/禁言 1h @某人" 或 "/禁言 @某人 1h"
  #   /解禁 [@目标]                解除禁言；正在验证中的成员不受此命令影响
  #   /重新发送验证 [@目标]        给正在验证的人重发通知（沿用他已有的按钮）
  #   /重新验证 [@目标]            重新开始一轮：换新令牌、重新禁言、发新卡片
  #   /debug 超时测试 [@目标]      立刻走一遍超时处理（需 debug: true）
  #
  # 目标只能用 @ 指定。平台不给"用 QQ 号指定成员"的接口（实测），所以
  # 无法实现 /禁言 123456789。
  # 引用消息 + AI 送检的违规检测。
  # 默认关闭：先用 dry_run 观察误报率，再决定是否让它动手。
  moderation:
    enabled: false
    dry_run: true
    cache_hours: 6                 # 消息在 Redis 里留多久（也是能回溯的上限）
    context_before: 10             # 被举报者本人之前的消息，至多取几条
    context_after: 10              # 之后的，至多取几条
    chain_minutes: 10              # 且链两端间隔不超过这么多分钟
    # 只送被举报者本人的消息：窗口里不会有别人说的话。别人的广告看到了也动不了
    # （撤回只允许针对被举报者），而且旁人的话不该进一个与他无关的判定。
    context_scope: group           # group（该群时间线）| sender（只看发送者）
    max_chars: 12000               # 送检正文上限，超出会在提示里标明已截断

    # OpenAI 格式。name 填好之后判定才会启用；留空时 /违规举报 只会回
    # 「送检失败，未采取任何处理」，不会误伤任何人。
    #
    # 这里刻意不写环境变量引用语法：被引用的变量必须已经存在，否则机器人根本
    # 起不来。要放环境变量，就留空 api_key，并把 MODERATION_API_KEY 放进服务环境。
    model:
      base_url: "https://api.deepseek.com/v1"
      api_key: ""
      name: ""
      timeout_seconds: 30
      stream: false                # 判定不需要流式；库同样支持
      temperature: 0

    # 违规类型 → 展示名 + 禁言时长（Go 语法：30s / 10m / 6h / 1d）。
    # 表外的类型一律不动作；类型没写时长的用 default_mute。
    categories:
      ad:    { label: "广告", mute: "10m" }
      fraud: { label: "诈骗", mute: "6h" }
    default_mute: "10m"

    # 未发现违规时是否反噬举报者（默认关）。
    report_penalty:
      enabled: false
      mute: "10m"

    # 每群独立设置。allow 是否决权：命中的消息连模型都不会被问。
    # groups:
    #   "群 openid":
    #     allow: ["官网", "example.com"]
    #     categories: { ad: "30m" }
    #     enabled: false
  admin_commands:
    enabled: true

    prefix: "/"

    # /debug 是否可用
    debug: true

    # 是否把命令清单注册成平台的「指令面板」（群里点开就是这份菜单）。
    # 默认开启：不开的话，成员只能靠别人告诉才知道有哪些命令。
    # /debug 永远不注册 —— 它是给运维用的，不该摆在群里让人按。
    # 面板按 bot.groups 里的群生效；bot.groups 为空时对所有群生效。
    register_commands: true

    # /whois 是否仅管理员可用。
    # 群里**还没配管理员**时它对该群所有人开放 —— 那正是把管理员列表
    # 写出来的唯一办法。未配置的群同理：那里的消息本来会被全部丢弃，
    # 只放行 /whois，否则新群永远配不出来。
    whois_admin_only: true

    # 是否必须 @ 机器人。开启后 @ 别人不会触发命令：程序会拿机器人自己的
    # openid 与正文里那个 @ 比对，而不是"开头有 @ 就算"。
    require_mention: true

    # ── 按群的管理员名单 ───────────────────────────────────────────
    # 只认这里列出的 member_openid。名单外一律拒绝 —— **包括 QQ 群主和
    # 群管理员本身**：平台身份不等于本程序的管理权限，否则任何人在 QQ 里
    # 被设成群管理，就顺带拿到了这些命令。
    groups:
      "FABED0ACCA31B997DFF11DC30658D252":
        admins:
          - "A1B2C3D4E5F6A1B2C3D4E5F6A1B2C3D4"
        # 该群禁言上限，可低于全局的 29 天。支持 30s / 10m / 2h / 1d
        # 及 30秒 / 10分 / 2小时 / 1天
        max_mute: "29d"

