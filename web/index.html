<!DOCTYPE html>
<html lang="zh-CN" style="color-scheme: dark;">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="robots" content="noindex, nofollow" />
    <!-- 内联 data URI 图标：不引任何 CDN / 远程字体 -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231b1b19'/%3E%3Crect x='7' y='11' width='18' height='14' rx='4' fill='%23cc785c'/%3E%3C/svg%3E"
    />
    <title>QQ 群管理机器人 · 运维控制台</title>
    <style>
      /* 首屏兜底样式：与 src/styles/tokens.css 的 --background / --foreground 同值。
         即使 JS 被环境拦住（例如 file:// 下模块脚本被拒），页面也只会显示这行提示，
         不会白屏。 */
      html,
      body {
        margin: 0;
        background: #1b1b19;
        color: #faf9f5;
        font-family: Inter, 'Segoe UI', system-ui, -apple-system, 'Noto Sans SC', sans-serif;
      }
      .boot {
        padding: 32px 24px;
        font-size: 14px;
        line-height: 1.6;
      }
      .boot .boot-sub {
        color: #b0aea5;
        font-size: 12.5px;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot">
        <div>正在加载控制台…</div>
        <div class="boot-sub">
          若长时间停留在此提示，说明前端脚本未能执行（后端未启动不影响本页渲染）。
        </div>
      </div>
    </div>
    <noscript>
      <div class="boot">
        <div>控制台需要启用 JavaScript。</div>
        <div class="boot-sub">本页面不引入任何第三方脚本或 CDN 资源。</div>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
